services:
  bank_simulator:
    container_name: bank_simulator
    image: bbyars/mountebank:2.8.1
    ports:
      - "2525:2525"
      - "8080:8080"
    command: --configfile /imposters/bank_simulator.ejs --allowInjection
    volumes:
      - type: bind
        source: ./imposters
        target: /imposters

  payment_gateway:
    container_name: payment_gateway
    build: .
    ports:
      - "8090:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      BankSimulator__BaseUrl: http://bank_simulator:8080/
      Logging__Console__FormatterName: json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire_dashboard:18889
    depends_on:
      - bank_simulator
      - aspire_dashboard

  aspire_dashboard:
    container_name: aspire_dashboard
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.5
    ports:
      - "18888:18888"
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
